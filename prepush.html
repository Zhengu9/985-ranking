function d(s,end=false){return /^\d{4}-\d{2}-\d{2}$/.test(s||"")?new Date(s+(end?"T23:59:59+08:00":"T00:00:00+08:00")):null}
function state(e){let st=d(e.start),dl=d(e.deadline,true);if(!st&&!dl)return"unknown";if(e.source==="needs-check"&&!dl)return"unknown";if(dl&&today>dl)return"closed";if(st&&today<st)return"soon";return"active"}
function left(e){let dl=d(e.deadline,true);return dl?Math.ceil((dl-today)/86400000):null}
function bar(e){let dl=d(e.deadline,true);if(!dl)return"";let st=d(e.start)||new Date(dl.getTime()-45*86400000),pct=Math.max(0,Math.min(100,Math.round((today-st)/(dl-st)*100))),l=left(e),cls=l<=2?"danger":l<=10?"warn":"",txt=l<0?"已截止":l===0?"今天截止":"剩余 "+l+" 天";return`<div class="progress"><div class="plabel"><span>截止进度</span><span>${txt}</span></div><div class="pline"><div class="pfill ${cls}" style="width:${pct}%"></div></div></div>`}
function label(s){return{active:"正在报名",soon:"即将开始",closed:"已截止",unknown:"待复核"}[s]}
function srcText(s){return{college:"学院通知",school:"学校通知/系统",["needs-check"]:"需复核"}[s]}
function val(id){return document.getElementById(id).value}
function filtered(){let q=document.querySelector("#q").value.trim().toLowerCase(),st=val("status"),ti=val("tier"),so=val("source");let arr=entries.filter(e=>(st==="all"||state(e)===st)&&(ti==="all"||e.tier===ti)&&(so==="all"||e.source===so)&&(!q||[e.school,e.unit,e.programs,e.materials,e.note].join(" ").toLowerCase().includes(q)));if(val("sort")==="school")arr.sort((a,b)=>a.school.localeCompare(b.school,"zh"));else arr.sort((a,b)=>(a.deadline||"2099-12-31").localeCompare(b.deadline||"2099-12-31"));return arr}
function idOf(e){return"entry-"+entries.indexOf(e)}
function card(e){let s=state(e);return`<article class="card ${s}" id="${idOf(e)}"><div class="row"><div><div class="school">${e.school}</div><div class="unit">${e.unit}</div></div><span class="badge">${e.tier}</span></div><div class="badges"><span class="badge ${s}">${label(s)}</span><span class="badge official">${srcText(e.source)}</span></div><p class="desc"><b>可报方向：</b>${e.programs}</p><div class="data"><div><label>开始</label><b>${e.start||"待定"}</b></div><div><label>截止</label><b>${e.deadline||"按学院/系统"}</b></div><div><label>考核</label><b>${e.exam}</b></div><div><label>剩余</label><b>${left(e)==null?"需进系统确认":left(e)+"天"}</b></div></div>${bar(e)}<div class="materials"><b>材料/动作</b><p>${e.materials}</p></div><p class="desc"><b>备注：</b>${e.note}</p><div class="actions"><a class="btn primary" target="_blank" href="${e.notice}">官方通知</a><a class="btn" target="_blank" href="${e.apply}">填报入口</a></div></article>`}
function renderCards(){let arr=filtered(),st=val("status");cardsTitle.textContent=st==="active"?"正在报名项目列表":st==="closed"?"已截止项目列表":st==="soon"?"即将开始项目列表":st==="unknown"?"待复核项目列表":"全部预推免项目列表";cardsSub.textContent=`当前筛选出 ${arr.length} 条，按${val("sort")==="deadline"?"截止时间":"学校"}排序。`;cards.innerHTML=arr.length?arr.map(card).join(""):'<div class="empty">当前筛选下没有项目。</div>'}
function renderSummary(){let c=s=>entries.filter(e=>state(e)===s).length,listed=new Set(entries.map(e=>e.school)),unlocated=watchSchools.filter(s=>!listed.has(s)).length;summary.innerHTML=`<div><b>${c("active")}</b><span>正在报名</span></div><div><b>${entries.filter(e=>e.source==="college").length}</b><span>学院通知</span></div><div><b>${entries.filter(e=>e.tier==="985").length}</b><span>985项目</span></div><div><b>${entries.filter(e=>e.tier==="211").length}</b><span>211项目</span></div><div><b>${entries.filter(e=>e.tier==="double").length}</b><span>双一流补充</span></div><div><b>${c("unknown")}</b><span>待复核项目</span></div><div><b>${unlocated}</b><span>未定位学校</span></div>`}
function renderQuick(){let arr=entries.filter(e=>state(e)==="active").sort((a,b)=>(a.deadline||"2099-12-31").localeCompare(b.deadline||"2099-12-31"));activeSchools.innerHTML=arr.map(e=>`<a class="quick-item" href="#${idOf(e)}"><b>${e.school}</b><span>${e.unit}</span><span>截止：${e.deadline||"按学院/系统"} · ${srcText(e.source)}</span></a>`).join("")}
function renderWatch(){let all=[...new Set([...entries.map(e=>e.school),...watchSchools])].sort((a,b)=>a.localeCompare(b,"zh"));let rows=all.map(s=>{let hit=entries.filter(e=>e.school===s);return`<tr><td><b>${s}</b></td><td>${hit.length?hit.map(e=>`${e.unit}（${label(state(e))}）`).join("<br>"):"未定位到2027计算机类预推免学院原文"}</td><td>${hit.length?hit.map(e=>`<a target="_blank" href="${e.notice}">${srcText(e.source)}</a>`).join("<br>"):"继续查学院研究生招生/通知公告栏目"}</td><td>${hit.length?"已进入主表，可点通知逐项复核":"不写时间，避免误导"}</td></tr>`}).join("");watchTable.innerHTML='<thead><tr><th>学校</th><th>状态</th><th>入口/依据</th><th>下一步</th></tr></thead><tbody>'+rows+'</tbody>'}
function renderSources(){sourceCards.innerHTML=entries.map(e=>`<article class="card"><div class="school">${e.school}</div><div class="unit">${e.unit}</div><p class="desc">${srcText(e.source)}：${e.note}</p><div class="actions"><a class="btn primary" target="_blank" href="${e.notice}">通知</a><a class="btn" target="_blank" href="${e.apply}">系统</a></div></article>`).join("")}
function render(){renderSummary();renderQuick();renderCards();renderWatch();renderSources()}
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{document.querySelectorAll(".tab,.panel").forEach(x=>x.classList.remove("active"));b.classList.add("active");document.querySelector("#panel-"+b.dataset.tab).classList.add("active")});
["q","status","tier","source","sort"].forEach(id=>document.querySelector("#"+id).addEventListener("input",render));
showAll.onclick=()=>{document.getElementById("status").value="all";render();document.querySelector("#panel-cards").scrollIntoView({behavior:"smooth"})};
render();
</script>
