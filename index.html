  <section class="panel" id="panel-closed">

      <table id="rankingTable"></table>
    </div>
  </section>
</main>

  "南京大学","北京航空航天大学","华中科技大学","国防科技大学","西北工业大学","北京理工大学",

  "湖南大学","大连理工大学","重庆大学","中国农业大学","兰州大学","中央民族大学",
  "西北农林科技大学","中国海洋大学","吉林大学"
];

function byDate(a, b) {
  const ad = a.deadline || "2099-12-31";
  const bd = b.deadline || "2099-12-31";
  return ad.localeCompare(bd);
}

function daysLeft(dateStr) {
  if (!dateStr) return null;
  const now = new Date("2026-07-04T00:00:00+08:00");
  const end = new Date(dateStr + "T23:59:59+08:00");
  return Math.ceil((end - now) / 86400000);
}

function progress(project) {
  if (!project.deadline) return "";
  const start = project.start ? new Date(project.start + "T00:00:00+08:00") : new Date("2026-05-01T00:00:00+08:00");
  const end = new Date(project.deadline + "T23:59:59+08:00");
  const now = new Date("2026-07-04T00:00:00+08:00");
  const total = Math.max(1, end - start);
  const pct = Math.max(0, Math.min(100, Math.round(((now - start) / total) * 100)));
  const left = daysLeft(project.deadline);
  const cls = left !== null && left <= 2 ? "danger" : left !== null && left <= 7 ? "warn" : "";
  const label = left === null ? "" : left < 0 ? "已截止" : left === 0 ? "今天截止" : "剩余 " + left + " 天";
  return '<div class="progress"><div class="progress-label"><span>截止进度</span><span>' + label + '</span></div><div class="progress-line"><div class="progress-fill ' + cls + '" style="width:' + pct + '%"></div></div></div>';
}

function sourceBadge(project) {
  if (project.source === "notice") return '<span class="badge notice">学院通知</span>';
  if (project.source === "system") return '<span class="badge system">官方报名系统</span>';
  return '<span class="badge missing">暂缺学院通知</span>';
}

function typeLabel(type) {
  if (type === "summer") return "夏令营";
  if (type === "prepush") return "预推免";
  return "报名系统";
}

function statusLabel(status) {
  return {active:"正在进行", upcoming:"即将开始", closed:"已截止", no_notice:"暂无通知"}[status] || status;
}

function filtered(list) {
  const q = document.getElementById("search").value.trim().toLowerCase();
  const type = document.getElementById("typeFilter").value;
  const tier = document.getElementById("tierFilter").value;
  const source = document.getElementById("sourceFilter").value;
  return list.filter(p => {
    const hay = [p.school, p.unit, p.title, p.desc, p.tier].join(" ").toLowerCase();
    if (q && !hay.includes(q)) return false;
    if (type !== "all" && p.type !== type) return false;
    if (tier !== "all" && p.tier !== tier) return false;
    if (source !== "all" && p.source !== source) return false;
    return true;
  });
}

function card(project) {
  const mainLink = project.noticeUrl || project.applyUrl;
  const noticeButton = project.noticeUrl
    ? '<a class="btn primary" target="_blank" href="' + project.noticeUrl + '">学院通知</a>'
    : '<span class="btn disabled">暂无学院通知原文</span>';
  const applyButton = project.applyUrl
    ? '<a class="btn" target="_blank" href="' + project.applyUrl + '">报名系统</a>'
    : '';
  return '<article class="program-card ' + project.status + '">' +
    '<div class="card-head"><div><div class="school-name">' + project.school + '</div><div class="unit">' + project.unit + '</div></div><span class="badge rank">' + project.tier + '</span></div>' +
    '<div class="badges"><span class="badge ' + project.status + '">' + statusLabel(project.status) + '</span><span class="badge">' + typeLabel(project.type) + '</span>' + sourceBadge(project) + '</div>' +
    '<p class="desc"><strong>' + project.title + '</strong><br>' + project.desc + '</p>' +
    '<div class="timeline"><div class="time-box"><label>报名开始</label><b>' + (project.start || "待定") + '</b></div><div class="time-box"><label>报名截止</label><b>' + (project.deadline || "待定") + '</b></div><div class="time-box"><label>活动/考核</label><b>' + (project.event || "待定") + '</b></div></div>' +
    progress(project) +
    '<div class="actions">' + noticeButton + applyButton + '</div>' +
  '</article>';
}

function renderPanel(status, id) {
  const list = filtered(projects.filter(p => p.status === status)).sort(byDate);
  document.getElementById(id).innerHTML = list.length ? list.map(card).join("") : '<div class="empty">当前筛选下没有项目。</div>';
}

function renderSummary() {
  const counts = {
    active: projects.filter(p => p.status === "active").length,
    upcoming: projects.filter(p => p.status === "upcoming").length,
    closed: projects.filter(p => p.status === "closed").length,
    notice: projects.filter(p => p.source === "notice").length
  };
  document.getElementById("summary").innerHTML =
    '<div class="summary-card"><strong>' + counts.active + '</strong><span>正在进行</span></div>' +
    '<div class="summary-card"><strong>' + counts.upcoming + '</strong><span>即将开始</span></div>' +
    '<div class="summary-card"><strong>' + counts.closed + '</strong><span>已截止</span></div>' +
    '<div class="summary-card"><strong>' + counts.notice + '</strong><span>有学院通知原文</span></div>';
}

function renderSchools() {
  const q = document.getElementById("search").value.trim().toLowerCase();
  const tier = document.getElementById("tierFilter").value;
  const rows = rankings.filter(r => {
    if (tier !== "all" && r[2] !== tier) return false;
    if (!q) return true;
    return r.join(" ").toLowerCase().includes(q) || projects.some(p => p.school === r[1] && [p.unit,p.title,p.desc].join(" ").toLowerCase().includes(q));
  });
  document.getElementById("schoolGrid").innerHTML = rows.map(r => {
    const ps = projects.filter(p => p.school === r[1]);
    const body = ps.length ? ps.map(p => {
      const link = p.noticeUrl ? '<a class="btn primary" target="_blank" href="' + p.noticeUrl + '">学院通知</a>' : '<span class="btn disabled">暂无学院通知原文</span>';
      const apply = p.applyUrl ? '<a class="btn" target="_blank" href="' + p.applyUrl + '">报名系统</a>' : '';
      return '<div class="school-project"><strong>' + p.unit + ' · ' + p.title + '</strong><div class="badges"><span class="badge ' + p.status + '">' + statusLabel(p.status) + '</span>' + sourceBadge(p) + '</div><p class="desc">' + p.desc + '</p><div class="actions">' + link + apply + '</div></div>';
    }).join("") : '<div class="school-project"><strong>计算机相关学院</strong><div class="badges"><span class="badge missing">暂缺学院通知</span></div><p class="desc">本次核对未找到稳定的学院官方夏令营/预推免通知。后续只在找到具体通知页或报名系统时添加链接。</p></div>';
    return '<article class="school-card"><h3>' + r[0] + '. ' + r[1] + ' <span class="badge rank">' + r[2] + '</span></h3><div class="unit">' + r[3] + ' · 学科评估 ' + r[4] + '</div><p class="desc">' + r[5] + '</p>' + body + '</article>';
  }).join("");
}

function renderRanking() {
  document.getElementById("rankingTable").innerHTML =
    '<thead><tr><th>排名</th><th>学校</th><th>梯队</th><th>城市</th><th>学科评估</th><th>备注</th></tr></thead><tbody>' +
    rankings.map(r => '<tr><td>' + r[0] + '</td><td><strong>' + r[1] + '</strong></td><td>' + r[2] + '</td><td>' + r[3] + '</td><td>' + r[4] + '</td><td>' + r[5] + '</td></tr>').join("") +
    '</tbody>';
}

function renderAll() {
  renderSummary();
  renderPanel("active", "activeGrid");
  renderPanel("upcoming", "upcomingGrid");
  renderPanel("closed", "closedGrid");
  renderSchools();
  renderRanking();
}

document.querySelectorAll(".tab").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".tab").forEach(x => x.classList.remove("active"));
    document.querySelectorAll(".panel").forEach(x => x.classList.remove("active"));
    btn.classList.add("active");
    document.getElementById("panel-" + btn.dataset.tab).classList.add("active");
  });
});
["search","typeFilter","tierFilter","sourceFilter"].forEach(id => document.getElementById(id).addEventListener("input", renderAll));
renderAll();
</script>
